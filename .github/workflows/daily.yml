name: AI Daily News - daily update

on:
  schedule:
    # 07:00 Vietnam time (UTC+7) = 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:  # allow manual runs
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/daily.yml'

permissions:
  contents: write  # allow pushing the generated report

env:
  TZ: Asia/Ho_Chi_Minh

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # full history for archiving

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        cd scripts
        pip install -r requirements.txt

    # Fails the job (and skips the commit) when no source returns any news
    - name: Fetch news
      run: |
        cd scripts
        python fetch_news.py

    # Translates headlines EN <-> VI; keeps original titles if the secret is missing
    - name: Translate headlines
      run: |
        cd scripts
        python translate.py
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    - name: Generate HTML
      run: |
        cd scripts
        python generate.py

    - name: Commit and push
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add -A
        git diff --quiet && git diff --staged --quiet || git commit -m "docs: update daily report $(date '+%Y-%m-%d')"
        git push

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: daily-news
        path: |
          index.html
          archive/
          data/
